<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المتجر — PC TECH STORE</title>
  <meta name="description" content="كل منتجات PC TECH STORE: لابتوب، كمبيوتر مكتبي، تجميعات جيمينج، كروت شاشة، شاشات، هاردات ورامات — بضمان مكتوب." />
  <meta name="theme-color" content="#0a1526" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f5eff'/%3E%3Ctext x='50' y='69' font-family='Arial' font-size='44' font-weight='bold' fill='white' text-anchor='middle'%3ETP%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css?v=1" />
</head>
<body data-page="shop">
  <a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

  <div id="siteHeader"></div>

  <main id="main">
    <div class="page-head">
      <div class="wrap">
        <nav class="crumbs" aria-label="مسار التنقل">
          <a href="index.html">الرئيسية</a>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
          <span>المتجر</span>
        </nav>
        <h1 id="shopTitle">كل المنتجات</h1>
        <p id="shopSub">لابتوبات وأجهزة مكتبية وكروت شاشة وشاشات — كلها بضمان مكتوب.</p>
      </div>
    </div>

    <div class="wrap shop-layout">
      <aside class="filters" id="filters" aria-label="تصفية المنتجات"></aside>

      <div class="shop-main">
        <div class="shop-toolbar">
          <button type="button" class="btn btn-outline filter-toggle" id="filterToggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
            الفلاتر
          </button>
          <span class="result-count" id="resultCount"></span>
          <span class="spacer"></span>
          <label class="sort-field">
            ترتيب حسب
            <select id="shopSort" aria-label="ترتيب المنتجات">
              <option value="featured">الأكثر طلباً</option>
              <option value="price-asc">الأرخص الأول</option>
              <option value="price-desc">الأغلى الأول</option>
              <option value="rating">الأعلى تقييم</option>
              <option value="new">الجديد الأول</option>
            </select>
          </label>
        </div>

        <div class="chips" id="activeChips"></div>
        <div class="product-grid" id="shopGrid"></div>
        <div id="shopEmpty"></div>
      </div>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="assets/js/data.js?v=1" defer></script>
  <script src="assets/js/main.js?v=1" defer></script>
</body>
</html>
